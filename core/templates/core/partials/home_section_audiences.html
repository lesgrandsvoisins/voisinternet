{% load i18n %}
{% if audiences %}
  <section class="block publics" aria-labelledby="pub-title" id="page-home-audiences-section">
    <div class="wrap">
      <h2 id="pub-title">{% trans "Vous êtes…" %}</h2>
      <ul class="aud">
        {% for a in audiences %}
          <li>
            <a href="{% url 'core:groupes' %}#available-groups"><strong>{{ a.name }}</strong><span>{{ a.pitch }}</span></a>
          </li>
        {% endfor %}
      </ul>
    </div>
    <a class="scroll-down"
       href="#page-home-how-section"
       data-scroll-head="#page-home-audiences-section"
       data-scroll-flat
       aria-label="{% trans "Aller à la suite" %}">
      {% include "core/icons/chevron-down-svg.html" %}
    </a>
  </section>
{% endif %}
