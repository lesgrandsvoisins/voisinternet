{% load i18n %}

{% if poles %}
  <section class="block" aria-labelledby="poles-title" id="page-home-poles-section">
    <div class="wrap">
      <h2 id="poles-title">{% trans "Nos trois pôles" %}</h2>
      <p class="intro">{% trans "Portés ensemble par les bénévoles, chacun avec sa couleur et ses rendez-vous." %}</p>
      <div class="poles-grid">
        {% for pole in poles %}
          <a class="pole-card accent-{{ pole.accent }}" href="{{ pole.url }}">
            <h3>{{ pole.title }}</h3>
            <p>{{ pole.lead }}</p>
          </a>
        {% endfor %}
      </div>
    </div>
    <a class="scroll-down"
       href="#page-home-blog-section"
       data-scroll-head="#page-home-poles-section"
       data-scroll-flat
       aria-label="{% trans "Aller à la suite" %}">
      {% include "core/icons/chevron-down-svg.html" %}
    </a>
  </section>
{% endif %}
