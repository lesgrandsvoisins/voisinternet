{% load i18n %}{% if entries %}
<ul class="docs">
  {% for entry in entries %}
  <li>
    <details class="entry-menu" name="entry-menu">
      <summary class="entry-menu-btn">{{ entry.name }}</summary>
      <div class="entry-menu-panel">
        <a href="{% url 'core:entry_detail' entry.slug %}">{{ entry.get_visibility_display }}</a>
        <a href="{% url 'core:fiche_modifier' entry.slug %}">{% trans "Modifier" %}</a>
        <form method="post" action="{% url 'core:fiche_supprimer' entry.slug %}" onsubmit="return confirm('{% trans "Supprimer cette fiche ?" %}');">{% csrf_token %}<button class="link-btn" type="submit">{% trans "Supprimer" %}</button></form>
      </div>
    </details>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="intro">{% trans "Vous n'avez pas encore de fiche dans l'annuaire." %}</p>
{% endif %}
