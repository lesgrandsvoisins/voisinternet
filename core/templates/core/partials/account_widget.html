{% load i18n %}
<div class="account-panel"
     id="account-panel"
     x-data="{ open: false }"
     x-on:keydown.escape.window="open = false"
     x-on:click.outside="open = false">
  <button type="button"
          class="account"
          id="account"
          x-on:click="open = !open"
          x-bind:aria-expanded="open.toString()"
          aria-controls="account-menu"
          aria-label="{% blocktrans %}Mon compte : {{ account_sub }}{% endblocktrans %}"
          notonclick="javascript:if(typeof doubleclicked === 'undefined'){doubleclicked=false} else if (!doubleclicked){doubleclicked=true;}else{location.href='{% url 'core:account' %}';}">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
	<!-- Icon downloaded from https://icon-sets.iconify.design/mdi/account-arrow-down-outline/ -->
	<path d="M0 0h24v24H0z" fill="none" />
	<path fill="var(--ink)" d="M19 18v-4h-2v4h-2l3 3l3-3zM11 4C8.8 4 7 5.8 7 8s1.8 4 4 4s4-1.8 4-4s-1.8-4-4-4m0 2c1.1 0 2 .9 2 2s-.9 2-2 2s-2-.9-2-2s.9-2 2-2m0 7c-2.7 0-8 1.3-8 4v3h9.5c-.3-.6-.4-1.2-.5-1.9H4.9V17c0-.6 3.1-2.1 6.1-2.1c.5 0 1 .1 1.5.1c.3-.6.6-1.2 1.1-1.7c-1-.2-1.9-.3-2.6-.3" />
</svg>

    {% comment %} <b>{% trans "mon Compte" %}</b> {% endcomment %}
    {% comment %} <small>{{ account_sub }}</small> {% endcomment %}
  </button>
  <div class="account-menu"
       id="account-menu"
       role="menu"
       x-show="open"
       x-cloak
       aria-label="{% trans "Options de mon compte" %}">
    <button type="button"
            class="account-menu-close"
            x-on:click="open = false"
            aria-label="{% trans "Fermer" %}">×</button>
    {% include "core/partials/account_panel_body.html" %}
  </div>
</div>
