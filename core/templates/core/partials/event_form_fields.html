{% load i18n %}{% if form.non_field_errors %}<ul class="errorlist">{{ form.non_field_errors }}</ul>{% endif %}
{% for field in form %}
<div class="form-row">
  {{ field.label_tag }}
  {% if field.name == "photo" and field.value %}
  <img class="form-photo-current" src="{{ field.value.url }}" alt="">
  {% endif %}
  {{ field }}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
{% endfor %}
