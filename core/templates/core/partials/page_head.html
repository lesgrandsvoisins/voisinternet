{% load i18n %}<div class="page-head{% if accent %} accent-{{ accent }}{% endif %}">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="{% trans "Fil d’Ariane" %}">
      <ol>
        <li><a href="{% url 'core:home' %}">{% trans "Accueil" %}</a></li>
        {% comment %} <li>{{ item.group_caption }}</li> {% endcomment %}
        <li aria-current="page">{{ item.entry.title }}</li>
      </ol>
    </nav>
    <div class="page-head-top">
      {% if icon_url %}<img class="page-head-icon" src="{{ icon_url }}" alt="">{% endif %}
      <h1>{{ item.entry.title }}</h1>
    </div>
    {% if lead %}<p class="lead">{{ lead }}</p>{% endif %}
  </div>
</div>
