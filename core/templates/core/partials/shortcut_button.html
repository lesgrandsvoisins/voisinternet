{% load i18n %}<form class="shortcut" method="post" action="{% url 'core:toggle_shortcut' service.slug %}" hx-post="{% url 'core:toggle_shortcut' service.slug %}" hx-target="{{ target_id|default:'this' }}" hx-swap="{{ swap|default:'outerHTML' }}">
  {% csrf_token %}<input type="hidden" name="next" value="{{ next|default:request.get_full_path }}">
  <button class="add" type="submit" aria-pressed="{{ added|yesno:'true,false' }}" aria-label="{% if added %}{% blocktrans with name=service.name %}Retirer {{ name }} de mes raccourcis{% endblocktrans %}{% else %}{% blocktrans with name=service.name %}Ajouter {{ name }} à mes raccourcis{% endblocktrans %}{% endif %}">{% if added %}{% trans "Ajouté" %}{% else %}{% trans "Ajouter" %}{% endif %}</button>
</form>
